name: Build NEON VPN

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q NEON-VPN-Android-Phone-Build.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: source/NEON-VPN-Android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NEON-VPN-APK
          path: source/NEON-VPN-Android/app/build/outputs/apk/debug/app-debug.apk
